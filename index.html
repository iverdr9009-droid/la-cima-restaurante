<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Cima - Restaurante & Tienda</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; }
    header { background: #1a237e; color: white; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; padding: 15px; }
    .tab { display: flex; gap: 10px; margin: 15px 0; }
    .tab button { flex: 1; padding: 12px; border: 2px solid #1a237e; background: white; color: #1a237e; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab button.active { background: #1a237e; color: white; }
    .card { background: white; padding: 15px; border-radius: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-name { font-weight: bold; }
    .card-price { color: #2e7d32; font-weight: bold; }
    .btn-delete { background: #e53935; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: none; }
    .admin-panel { background: white; padding: 15px; border-radius: 10px; display: none; margin: 15px 0; }
    .admin-panel input, .admin-panel select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 16px; }
    .btn-primary { background: #1a237e; color: white; }
    .btn-danger { background: #607d8b; color: white; }
    .btn-warning { background: #ff9800; color: white; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
    .modal-box { background: white; padding: 20px; border-radius: 10px; width: 85%; max-width: 300px; }
    .modal-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
    .admin-link { text-align: center; margin-top: 20px; }
    .admin-link a { color: #999; font-size: 12px; }
    .loading { text-align: center; color: #1a237e; padding: 20px; font-weight: bold; }
    .empty { text-align: center; color: #999; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>La Cima</h1>
    <p>Restaurante & Tienda</p>
  </header>

  <div class="container">
    <!-- Botones -->
    <div style="display: flex; gap: 10px; margin: 15px 0;">
      <a href="https://wa.me/5356626475?text=Hola%20quisiera%20hacer%20un%20pedido" style="flex:1; text-align:center; padding:15px; background:#25d366; color:white; text-decoration:none; border-radius:8px; font-weight:bold;">🛵 Pedido</a>
      <a href="https://wa.me/5356626475?text=Hola%20quisiera%20reservar%20una%20mesa" style="flex:1; text-align:center; padding:15px; background:#0288d1; color:white; text-decoration:none; border-radius:8px; font-weight:bold;">📅 Reservar</a>
    </div>

    <!-- Tabs -->
    <div class="tab">
      <button id="tab-rest" class="active" onclick="cambiarTab('restaurante')">🍔 Restaurante</button>
      <button id="tab-tienda" onclick="cambiarTab('tienda')">🛒 Tienda</button>
    </div>

    <!-- Listas -->
    <div id="lista-restaurante"><div class="loading">Cargando...</div></div>
    <div id="lista-tienda" style="display:none;"></div>

    <!-- Panel Admin -->
    <div class="admin-panel" id="panel-admin">
      <h3>🔐 Admin</h3>
      <select id="tipo">
        <option value="restaurante">🍔 Restaurante</option>
        <option value="tienda">🛒 Tienda</option>
      </select>
      <input type="text" id="nombre" placeholder="Nombre del producto">
      <input type="number" id="precio" placeholder="Precio">
      <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
      <button class="btn btn-warning" onclick="cambiarPass()">🔑 Cambiar Contraseña</button>
      <button class="btn btn-danger" onclick="cerrarAdmin()">Salir</button>
    </div>

    <!-- Link Admin -->
    <div class="admin-link">
      <a href="#" onclick="abrirLogin()">🔑 Acceso Admin</a>
    </div>
  </div>

  <!-- Modal Login -->
  <div class="modal" id="modal-login">
    <div class="modal-box">
      <h3>Contraseña</h3>
      <input type="password" id="pass-input" placeholder="Contraseña">
      <button class="btn btn-primary" onclick="login()">Entrar</button>
      <button class="btn btn-danger" onclick="cerrarLogin()">Cancelar</button>
    </div>
  </div>

  <script>
    const GITHUB_TOKEN = "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";
    const GITHUB_USER = "iverdr9009-droid";
    const GITHUB_REPO = "la-cima-restaurante";
    const API_URL = "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/contents/productos.json";
    const RAW_URL = "https://raw.githubusercontent.com/" + GITHUB_USER + "/" + GITHUB_REPO + "/main/productos.json";
    
    let productos = [];
    let esAdmin = false;

    function cargar() {
      fetch(RAW_URL + '?t=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          productos = data || [];
          mostrar();
        })
        .catch(function(err) {
          console.log('Error:', err);
          document.getElementById('lista-restaurante').innerHTML = '<div class="empty">No hay productos</div>';
          document.getElementById('lista-tienda').innerHTML = '<div class="empty">No hay productos</div>';
        });
    }

    function mostrar() {
      var listaR = document.getElementById('lista-restaurante');
      var listaT = document.getElementById('lista-tienda');
      listaR.innerHTML = '';
      listaT.innerHTML = '';
      
      productos.forEach(function(p) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<div><div class="card-name">' + p.nombre + '</div><div class="card-price">$' + p.precio + '</div></div>' + (esAdmin ? '<button class="btn-delete" style="display:block;" onclick="eliminar(\'' + p.id + '\')">✕</button>' : '');
        
        if (p.tipo === 'tienda') {
          listaT.appendChild(card);
        } else {
          listaR.appendChild(card);
        }
      });
      
      if (listaR.innerHTML === '') listaR.innerHTML = '<div class="empty">No hay platillos</div>';
      if (listaT.innerHTML === '') listaT.innerHTML = '<div class="empty">No hay productos</div>';
    }

    function guardar() {
      var nombre = document.getElementById('nombre').value.trim();
      var precio = document.getElementById('precio').value.trim();
      var tipo = document.getElementById('tipo').value;
      
      if (!nombre || !precio) {
        alert('Completa nombre y precio');
        return;
      }
      
      var nuevo = {
        id: Date.now().toString(),
        nombre: nombre,
        precio: precio,
        tipo: tipo
      };
      
      productos.push(nuevo);
      
      guardarEnGithub();
      
      document.getElementById('nombre').value = '';
      document.getElementById('precio').value = '';
      mostrar();
      alert('✅ Guardado correctamente');
    }

    function eliminar(id) {
      if (!confirm('¿Eliminar este producto?')) return;
      productos = productos.filter(function(p) { return p.id != id; });
      guardarEnGithub();
      mostrar();
    }

    function guardarEnGithub() {
      fetch(API_URL, {
        headers: { 'Authorization': 'token ' + GITHUB_TOKEN }
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var sha = data.sha;
        var contenido = JSON.stringify(productos);
        var base64 = btoa(unescape(encodeURIComponent(contenido)));
        
        return fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + GITHUB_TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update productos',
            content: base64,
            sha: sha
          })
        });
      })
      .then(function(r) {
        if (!r.ok) {
          alert('❌ Error al guardar');
        } else {
          console.log('✅ Guardado en GitHub');
        }
      })
      .catch(function(err) {
        console.log('Error:', err);
        alert('❌ Error de conexión');
      });
    }

    function cambiarTab(tab) {
      if (tab === 'restaurante') {
        document.getElementById('tab-rest').classList.add('active');
        document.getElementById('tab-tienda').classList.remove('active');
        document.getElementById('lista-restaurante').style.display = 'block';
        document.getElementById('lista-tienda').style.display = 'none';
      } else {
        document.getElementById('tab-tienda').classList.add('active');
        document.getElementById('tab-rest').classList.remove('active');
        document.getElementById('lista-restaurante').style.display = 'none';
        document.getElementById('lista-tienda').style.display = 'block';
      }
    }

    function abrirLogin() {
      document.getElementById('modal-login').style.display = 'flex';
      document.getElementById('pass-input').value = '';
    }
    
    function cerrarLogin() {
      document.getElementById('modal-login').style.display = 'none';
    }
    
    function login() {
      var pass = document.getElementById('pass-input').value;
      var correcta = localStorage.getItem('pass_admin') || '1234';
      
      if (pass === correcta) {
        esAdmin = true;
        document.getElementById('panel-admin').style.display = 'block';
        cerrarLogin();
        mostrar();
      } else {
        alert('❌ Contraseña incorrecta');
      }
    }
    
    function cerrarAdmin() {
      esAdmin = false;
      document.getElementById('panel-admin').style.display = 'none';
      mostrar();
    }
    
    function cambiarPass() {
      var nueva = prompt('Nueva contraseña (mínimo 4 caracteres):');
      if (nueva && nueva.length >= 4) {
        localStorage.setItem('pass_admin', nueva);
        alert('✅ Contraseña cambiada');
      } else {
        alert('❌ Contraseña muy corta');
      }
    }

    cargar();
  </script>
</body>
</html>
